# Baut die Seite bei jedem Push auf "main" und veröffentlicht sie auf GitHub Pages.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Eigene Domain: In GitHub unter Settings → Secrets and variables → Actions →
      # Variables die Variable CUSTOM_DOMAIN (z. B. noanattila.com) anlegen.
      # Ohne die Variable läuft die Seite unter <name>.github.io/<repo>/.
      - name: Build
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            export NEXT_PUBLIC_BASE_PATH=""
            export NEXT_PUBLIC_SITE_URL="https://$CUSTOM_DOMAIN/"
          else
            export NEXT_PUBLIC_BASE_PATH="/$REPO"
            export NEXT_PUBLIC_SITE_URL="https://$OWNER.github.io/$REPO/"
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
